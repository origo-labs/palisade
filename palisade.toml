# palisade.toml -- generated by `palisade init`.
#
# This is a proposal, not a verdict. Every gate below is at `warn`: it reports
# and nothing blocks, because a contract written today has been calibrated on
# nothing. That is the honest posture and it is the point.
#
# To make a gate block, promote it to `error` and say why, in a `[[changes]]`
# record naming the measurement behind it. A gate promoted without a
# `calibration` is reported by the built-in `contract_not_loosened` gate, which
# you cannot switch off -- it is part of the supervisor rather than this file.

# Detected a workspace with 10 members. The gates below apply to
# the whole tree; a workspace often wants a stricter contract per member, which
# means splitting this file and running the suite per directory.
# Severity: `off` skips a gate, `warn` reports, `error` blocks, `escalate` asks a
# human. Promoting `warn` -> `error` is a claim that this gate is worth
# blocking on, and it is the one claim here that needs evidence behind it.

version = 1

# The commit every two-tree gate compares against. Override per run with
# `palisade check --base <ref>`.
baseline = { ref = "HEAD" }

[budget]
# Bound on the observation. Below 1024 is a validation error: a truncated
# observation that small is not evidence of anything.
observation_bytes = 131072

[[gates]]
# runs `cargo fmt`, `clippy` and `test`. The most expensive gate in the suite; it costs about what your CI already spends on the same three commands
id = "checks_green"
check = "checks_green"
severity = "warn"

[[gates]]
# a declared production dependency changed. Also needs `checks_green` if you want the new dependency to build
id = "dependency_surface_unchanged"
check = "dependency_surface_unchanged"
severity = "warn"

[[gates]]
# a test disappeared, or gained `#[ignore]`. Add `consumes = ["checks_green"]` to also catch a test the source has but the build does not run
id = "tests_not_deleted"
check = "tests_not_deleted"
severity = "warn"

[[gates]]
# a public item's signature changed or was removed. Additions are reported at `warn` and never block
id = "public_api_unchanged"
check = "public_api_unchanged"
severity = "warn"

[[gates]]
# `unsafe` blocks, functions, impls or extern blocks were added. Growth is the trigger, not presence
id = "unsafe_surface_unchanged"
check = "unsafe_surface_unchanged"
severity = "warn"

[[gates]]
# an `#[allow]` was added or broadened, including to a whole tool's lints with `clippy::all`
id = "suppressions_not_widened"
check = "suppressions_not_widened"
severity = "warn"

[[gates]]
# a conventionally frozen path was touched. Edit `paths` below to change what is frozen
id = "paths_unchanged"
check = "paths_unchanged"
severity = "warn"
paths = ["fixtures", "testdata"]
# Not in this contract, on purpose. Both exist in the vocabulary and neither is
# implemented in this build, and a gate that is declared but unimplemented
# reports `error` rather than passing -- so shipping one by default would
# make a fresh project fail its own first run. Uncomment either when it is
# implemented, or when you want the run to say so loudly.
#
# [[gates]]
# id = "secret_absent"
# check = "secret_absent"
# severity = "warn"
#
# Needs a baseline artifact, which is the one piece of state this tool does not
# manage for you: `slop-gate index --ref {base} --output <path>`, committed or
# cached by your CI. The artifact is bound to the commit it was built from, so
# it must be rebuilt when the base moves -- asking for a stale one is an error,
# not a finding.
#
# [[gates]]
# id = "slop_gate"
# check = "external_tool"
# tool = "slop-gate"
# args = ["check", "--base", "{base}", "--head", "{head}", "--index", "slop-gate-index.json"]
# format = "sarif"
# severity = "warn"

# -------------------------------------------------------------------------
# The gap. Mandatory, and deliberately not empty: these are real things this
# suite cannot check, and a human still has to look at them. A contract that
# claimed completeness would be worse than no contract, because it manufactures
# confidence. Edit freely -- this list is the honest statement of what is not
# covered, and it is printed on every run.
[judgement]
reviewed = "2026-09-30"
not_covered = [
  "whether the chosen design is the right one for the problem",
  "whether error messages are good enough for an end user",
  "whether an added benchmark is a fair one",
  "whether the code is understandable to someone who did not write it",
  "whether a test asserts the behaviour it claims to assert"
]
