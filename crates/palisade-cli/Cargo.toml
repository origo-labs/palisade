[package]
name = "palisade-cli"
description = "The single palisade binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "palisade"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
palisade-git = { workspace = true }
palisade-observe = { workspace = true }
palisade-orchestrate = { workspace = true }
palisade-gates = { workspace = true }
palisade-exec = { workspace = true }
palisade-report = { workspace = true }
toml = { workspace = true }
palisade-contract = { workspace = true }
camino = { workspace = true }
clap = { workspace = true }

# The package metadata `cargo install` needs, duplicated from the workspace
# because `cargo install` reads the package manifest and cannot see inherited
# fields that resolve only at the workspace root. Repeated deliberately: the
# alternative is a publishing step, and a beta should be installable from a
# git tag without one.
[package.metadata.docs.rs]
all-features = true
